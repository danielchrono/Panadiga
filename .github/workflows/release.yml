name: Release Multiplatform Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag version (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # 1. Multi-Platform Binary Compilation & Packaging (Windows, Linux, macOS)
  # ==========================================================================
  build-release:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_cli: target/x86_64-pc-windows-msvc/release/panadiga.exe
            bin_desktop: target/x86_64-pc-windows-msvc/release/panadiga-desktop.exe
            archive_ext: zip
            archive_name: panadiga-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_cli: target/x86_64-unknown-linux-gnu/release/panadiga
            bin_desktop: target/x86_64-unknown-linux-gnu/release/panadiga-desktop
            archive_ext: tar.gz
            archive_name: panadiga-linux-x86_64.tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin_cli: target/aarch64-apple-darwin/release/panadiga
            bin_desktop: target/aarch64-apple-darwin/release/panadiga-desktop
            archive_ext: tar.gz
            archive_name: panadiga-macos-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Install Node Dependencies & Build Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Run Rust Workspace Tests
        run: cargo test --workspace

      - name: Compile Unified Panadiga Binaries
        run: cargo build --release --target ${{ matrix.platform.target }} -p panadiga-cli -p panadiga-desktop

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "staging_release"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "${{ matrix.platform.bin_cli }}" -Destination "$staging\panadiga.exe"
          Copy-Item "${{ matrix.platform.bin_desktop }}" -Destination "$staging\panadiga-desktop.exe"
          if (Test-Path "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_rp2040.uf2") {
              Copy-Item "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_rp2040.uf2" -Destination "$staging\panasonic_p7501_uart_rp2040.uf2"
          }
          if (Test-Path "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_rp2350.uf2") {
              Copy-Item "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_rp2350.uf2" -Destination "$staging\panasonic_p7501_uart_rp2350.uf2"
          }
          if (Test-Path "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2") {
              Copy-Item "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2" -Destination "$staging\panasonic_p7501_uart_unified.uf2"
          }
          New-Item -ItemType Directory -Path "$staging\tools" | Out-Null
          if (Test-Path "tools\ghidra") {
              Copy-Item "tools\ghidra" -Destination "$staging\tools\ghidra" -Recurse
          }
          Get-ChildItem -Path "tools" -Filter "*.cmd" -ErrorAction SilentlyContinue | Copy-Item -Destination "$staging\tools\"
          if (Test-Path "tools\README.md") {
              Copy-Item "tools\README.md" -Destination "$staging\tools\README.md"
          }
          Copy-Item "LICENSE" -Destination "$staging\LICENSE"
          
          Compress-Archive -Path "$staging\*" -DestinationPath "${{ matrix.platform.archive_name }}" -CompressionLevel Optimal
          Get-FileHash -Algorithm SHA256 "${{ matrix.platform.archive_name }}" | Out-File -FilePath "${{ matrix.platform.archive_name }}.sha256"

      - name: Package Unix Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          staging="staging_release"
          mkdir -p "$staging/tools"
          cp "${{ matrix.platform.bin_cli }}" "$staging/panadiga"
          cp "${{ matrix.platform.bin_desktop }}" "$staging/panadiga-desktop"
          if [ -d "tools/ghidra" ]; then cp -r tools/ghidra "$staging/tools/ghidra"; fi
          if [ -f "tools/README.md" ]; then cp tools/README.md "$staging/tools/README.md"; fi
          cp LICENSE "$staging/LICENSE"
          chmod +x "$staging/panadiga" "$staging/panadiga-desktop"

          tar -czvf "${{ matrix.platform.archive_name }}" -C "$staging" .
          shasum -a 256 "${{ matrix.platform.archive_name }}" > "${{ matrix.platform.archive_name }}.sha256"

          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "[*] Building Debian package (.deb)..."
            deb_dir="panadiga_deb_pkg"
            mkdir -p "$deb_dir/DEBIAN"
            mkdir -p "$deb_dir/usr/bin"
            mkdir -p "$deb_dir/usr/share/panadiga/tools"
            cp "${{ matrix.platform.bin_cli }}" "$deb_dir/usr/bin/panadiga"
            cp "${{ matrix.platform.bin_desktop }}" "$deb_dir/usr/bin/panadiga-desktop"
            chmod 755 "$deb_dir/usr/bin/panadiga" "$deb_dir/usr/bin/panadiga-desktop"
            if [ -d "tools/ghidra" ]; then cp -r tools/ghidra "$deb_dir/usr/share/panadiga/tools/ghidra"; fi
            if [ -f "tools/README.md" ]; then cp tools/README.md "$deb_dir/usr/share/panadiga/tools/README.md"; fi
            printf "Package: panadiga\nVersion: 0.1.0\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: OrgChrono Engineering <support@orgchrono.com>\nDepends: libc6, libwebkit2gtk-4.1-0, libayatana-appindicator3-1\nDescription: Panasonic DIGA DMR-EH55 Forensic, NVRAM and Reverse Engineering Suite\n" > "$deb_dir/DEBIAN/control"
            dpkg-deb --build "$deb_dir" "panadiga-linux-amd64.deb"
            shasum -a 256 "panadiga-linux-amd64.deb" > "panadiga-linux-amd64.deb.sha256"
          fi

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-${{ matrix.platform.name }}
          path: |
            ${{ matrix.platform.archive_name }}
            ${{ matrix.platform.archive_name }}.sha256
            ${{ runner.os == 'Linux' && 'panadiga-linux-amd64.deb' || '' }}
            ${{ runner.os == 'Linux' && 'panadiga-linux-amd64.deb.sha256' || '' }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.platform.archive_name }}
            ${{ matrix.platform.archive_name }}.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to GitHub Release (Linux & macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.platform.archive_name }}
            ${{ matrix.platform.archive_name }}.sha256
            ${{ runner.os == 'Linux' && 'panadiga-linux-amd64.deb' || '' }}
            ${{ runner.os == 'Linux' && 'panadiga-linux-amd64.deb.sha256' || '' }}
          generate_release_notes: true
          draft: false
          prerelease: false

  # ==========================================================================
  # 2. Raspberry Pi Pico Firmware Dual Target (RP2040 & RP2350)
  # ==========================================================================
  pico-firmware:
    name: Pico Firmware Dual Target (RP2040 & RP2350)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install ARM Embedded Toolchain & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clone Raspberry Pi Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git ${{ runner.temp }}/pico-sdk
          cd ${{ runner.temp }}/pico-sdk
          git submodule update --init --depth 1

      - name: Build Firmware for RP2040 (Raspberry Pi Pico / Pico W)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export CXXFLAGS="-include cstdint"
          mkdir -p target/pico-build/out
          cmake -S firmware/pico-p7501 -B target/pico-build/pico -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build target/pico-build/pico --config Release
          cp target/pico-build/pico/panasonic_p7501_uart.uf2 target/pico-build/out/panasonic_p7501_uart_rp2040.uf2
          sha256sum target/pico-build/out/panasonic_p7501_uart_rp2040.uf2 > target/pico-build/out/panasonic_p7501_uart_rp2040.uf2.sha256

      - name: Build Firmware for RP2350 (Raspberry Pi Pico 2 ARM Cortex-M33)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export CXXFLAGS="-include cstdint"
          cmake -S firmware/pico-p7501 -B target/pico-build/pico2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build target/pico-build/pico2 --config Release
          cp target/pico-build/pico2/panasonic_p7501_uart.uf2 target/pico-build/out/panasonic_p7501_uart_rp2350.uf2
          sha256sum target/pico-build/out/panasonic_p7501_uart_rp2350.uf2 > target/pico-build/out/panasonic_p7501_uart_rp2350.uf2.sha256

      - name: Merge Unified Multi-Family UF2 (RP2040 + RP2350) via Native Rust CLI
        run: |
          cargo run -p panadiga-cli -- pico merge-uf2 \
            --rp2040 target/pico-build/out/panasonic_p7501_uart_rp2040.uf2 \
            --rp2350 target/pico-build/out/panasonic_p7501_uart_rp2350.uf2 \
            --out target/pico-build/out/panasonic_p7501_uart_unified.uf2
          sha256sum target/pico-build/out/panasonic_p7501_uart_unified.uf2 > target/pico-build/out/panasonic_p7501_uart_unified.uf2.sha256

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panasonic_p7501_uart_firmware_binaries
          path: |
            target/pico-build/out/*.uf2
            target/pico-build/out/*.uf2.sha256
          retention-days: 30

      - name: Publish Firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/pico-build/out/panasonic_p7501_uart_rp2040.uf2
            target/pico-build/out/panasonic_p7501_uart_rp2040.uf2.sha256
            target/pico-build/out/panasonic_p7501_uart_rp2350.uf2
            target/pico-build/out/panasonic_p7501_uart_rp2350.uf2.sha256
            target/pico-build/out/panasonic_p7501_uart_unified.uf2
            target/pico-build/out/panasonic_p7501_uart_unified.uf2.sha256
          generate_release_notes: true

  # ==========================================================================
  # 3. Android Mobile APK Build & Release (AArch64)
  # ==========================================================================
  release-android-apk:
    name: Build & Release Android APK (AArch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_PATH"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies & Build Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Verify Android Rust Target Compilation
        run: cargo check -p panadiga-core -p panadiga-desktop --lib --target aarch64-linux-android

      - name: Build Android Release APK
        run: |
          export ANDROID_NDK_ROOT=$NDK_HOME
          cd apps/desktop
          npx @tauri-apps/cli android init --ci --skip-targets-install || true
          npx @tauri-apps/cli android build --apk --target aarch64-linux-android || true
          cd ../..
          mkdir -p release-apk
          find apps/desktop/src-tauri/gen/android -name "*.apk" -exec cp {} release-apk/panadiga-android-arm64.apk \; || true
          if [ -f "release-apk/panadiga-android-arm64.apk" ]; then
            shasum -a 256 "release-apk/panadiga-android-arm64.apk" > "release-apk/panadiga-android-arm64.apk.sha256"
          fi

      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apk/panadiga-android-arm64.apk
            release-apk/panadiga-android-arm64.apk.sha256
          generate_release_notes: true
          