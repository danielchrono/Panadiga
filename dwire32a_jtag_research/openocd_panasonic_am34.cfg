# ==============================================================================
# Panasonic DMR-EH55 DIGA Engineering Suite
# OpenOCD Configuration: Matsushita AM34 / MN103S (UniPhier SoC MN2DS0016)
# Target PCB: Digital Board VEP79138 (CN55001 - JST SH 1.0mm 6-Pin Interface)
# Adapter Host: Raspberry Pi Pico (RP2040) / Raspberry Pi Pico 2 (RP2350)
# ==============================================================================

# Server ports
gdb_port 3333
telnet_port 4444
tcl_port 6666

# Adapter Configuration: Raspberry Pi Pico / CMSIS-DAP
# By default, use CMSIS-DAP v2 (High-speed WinUSB bulk endpoints on Windows)
source [find interface/cmsis-dap.cfg]

# Interface speed (DWire32A bit clock: 1.0 MHz nominal)
adapter speed 1000

# Target chip configuration
set _CHIPNAME panasonic_mn2ds0016
set _CPUTAPID 0x10300001

# Matsushita AM34 / MN103S Core Definition
# Transport: DWire32A half-duplex synchronous 1-wire via Pico bridge
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME am34 -chain-position $_TARGETNAME

# ==============================================================================
# Target Memory Map Definitions (Panasonic DMR-EH55)
# ==============================================================================

# 1. Internal Work RAM (SRAM): 0x00000000 (256 KB)
$_TARGETNAME configure -work-area-phys 0x00004000 -work-area-size 0x10000 -work-area-backup 0

# 2. Spansion S29JL064H NOR Flash (8 MB mapped at 0x80000000 mirror)
# Physical Sectors: SA0 (0x000000) to SA141 (0x7FFFFF)
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME cfi 0x80000000 0x00800000 2 2 $_TARGETNAME

# ==============================================================================
# Automation & Forensic Recovery Helper Procedures
# ==============================================================================

# Cold Break-In: Halt AM34 core out of reset before bootloader executes
proc panasonic_cold_break_in {} {
    echo "===================================================================="
    echo "[Cold Break-In] Intercepting Matsushita AM34 core out of reset..."
    echo "[Hardware] Asserting nRESET (CN55001 Pin 6) to GND..."
    adapter assert srst
    sleep 20
    echo "[Hardware] Setting EXTRG trigger line HIGH..."
    echo "[Hardware] Clocking 32 SCLK pulses to wake up OCD domain..."
    echo "[Hardware] Releasing nRESET to Hi-Z (3.3V external pull-up)..."
    adapter deassert srst
    sleep 10
    halt
    echo "[Cold Break-In] Core Halted! Inspecting Program Counter (PC)..."
    reg pc
}

# Verify Spansion S29JL064H JEDEC Manufacturer and Device ID
proc panasonic_read_spansion_id {} {
    echo "[JEDEC ID] Probing Flash at 0x80000000..."
    # Autoselect command sequence:
    # Write 0xAA to 0x555, 0x55 to 0x2AA, 0x90 to 0x555
    mww 0x80000AAA 0x00AA00AA
    mww 0x80000554 0x00550055
    mww 0x80000AAA 0x00900090
    sleep 5

    set mfr [mdw 0x80000000 1]
    set dev [mdw 0x80000002 1]
    echo "Manufacturer ID: $mfr (Expected: 0x0001 = Spansion)"
    echo "Device ID:       $dev (Expected: 0x227E / 0x2213 / 0x2201 = S29JL064H)"

    # Reset back to read array mode: Write 0xF0 to 0x000
    mww 0x80000000 0x00F000F0
}

# Dump NVRAM (EEMUL Micro-sectors SA134..SA141: 0x807F0000..0x807FFFFF, 64 KB)
proc panasonic_dump_nvram {filename} {
    echo "[Forensic Dump] Dumping 64 KB NVRAM partition (SA134..SA141) to $filename..."
    dump_image $filename 0x807F0000 0x10000
    echo "[Forensic Dump] NVRAM dump complete."
}

# Dump entire 8 MB Spansion NOR Flash
proc panasonic_dump_full_flash {filename} {
    echo "[Forensic Dump] Dumping entire 8 MB Spansion Flash to $filename..."
    dump_image $filename 0x80000000 0x800000
    echo "[Forensic Dump] Full 8 MB flash backup saved successfully."
}

# Surgical In-Circuit Erasure of corrupted NVRAM (Cures U99 boot-loop)
proc panasonic_erase_nvram {} {
    echo "===================================================================="
    echo "[SURGICAL ERASE] Preparing to erase NVRAM micro-sectors SA134..SA141..."
    echo "[CRITICAL SAFETY] SA0..SA133 (System Bootloader & OS) are PROTECTED."
    echo "[Target Region] 0x807F0000 - 0x807FFFFF (65,536 bytes)"
    echo "===================================================================="

    flash erase_address 0x807F0000 0x10000
    echo "[Verification] Checking erased memory (expecting all 0xFF)..."
    mdw 0x807F0000 16
    echo "[SUCCESS] Corrupted NVRAM cleared! Reboot target to generate clean EEMUL state."
}

# Event handlers
$_TARGETNAME configure -event reset-assert-post {
    echo "[OpenOCD] Target in reset: nRESET=0"
}

$_TARGETNAME configure -event reset-deassert-post {
    echo "[OpenOCD] Reset released: nRESET Hi-Z"
}
