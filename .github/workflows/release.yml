name: Release Multiplatform Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag version (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Multi-Platform Binary Compilation & Packaging
  # ==========================================================================
  build-release:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_bin: target/x86_64-pc-windows-msvc/release/panadiga.exe
            desktop_bin: target/x86_64-pc-windows-msvc/release/panasonic-diga-desktop.exe
            archive_ext: zip
            archive_name: panadiga-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cli_bin: target/x86_64-unknown-linux-gnu/release/panadiga
            desktop_bin: target/x86_64-unknown-linux-gnu/release/panasonic-diga-desktop
            archive_ext: tar.gz
            archive_name: panadiga-linux-x86_64.tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            cli_bin: target/aarch64-apple-darwin/release/panadiga
            desktop_bin: target/aarch64-apple-darwin/release/panasonic-diga-desktop
            archive_ext: tar.gz
            archive_name: panadiga-macos-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      # Linux system dependencies for Tauri and WebKit
      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Install Node Dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Validate TypeScript & Vitest
        run: |
          cd apps/desktop
          npm run typecheck
          npm test

      - name: Run Rust Workspace Tests
        run: cargo test --workspace

      - name: Build Desktop Frontend (Vite)
        run: |
          cd apps/desktop
          npm run build

      - name: Compile Panadiga CLI Binary
        run: cargo build --release --target ${{ matrix.platform.target }} -p panadiga

      - name: Compile Desktop Binary (Tauri)
        run: cargo build --release --target ${{ matrix.platform.target }} -p panasonic-diga-desktop

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "staging_release"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "${{ matrix.platform.cli_bin }}" -Destination "$staging\panadiga-cli.exe"
          Copy-Item "${{ matrix.platform.desktop_bin }}" -Destination "$staging\panadiga-desktop.exe"
          $webview2 = "target/${{ matrix.platform.target }}/release/WebView2Loader.dll"
          if (Test-Path $webview2) {
              Copy-Item $webview2 -Destination "$staging\WebView2Loader.dll"
          }
          Copy-Item "tools" -Destination "$staging\tools" -Recurse
          Copy-Item "README.md" -Destination "$staging\README.md"
          Copy-Item "LICENSE" -Destination "$staging\LICENSE"
          
          Compress-Archive -Path "$staging\*" -DestinationPath "${{ matrix.platform.archive_name }}" -CompressionLevel Optimal
          Get-FileHash -Algorithm SHA256 "${{ matrix.platform.archive_name }}" | Out-File -FilePath "${{ matrix.platform.archive_name }}.sha256"

      - name: Package Unix Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          staging="staging_release"
          mkdir -p "$staging"
          cp "${{ matrix.platform.cli_bin }}" "$staging/panadiga-cli"
          cp "${{ matrix.platform.desktop_bin }}" "$staging/panadiga-desktop"
          cp -r tools "$staging/tools"
          cp README.md "$staging/README.md"
          cp LICENSE "$staging/LICENSE"
          chmod +x "$staging/panadiga-cli" "$staging/panadiga-desktop"

          tar -czvf "${{ matrix.platform.archive_name }}" -C "$staging" .
          shasum -a 256 "${{ matrix.platform.archive_name }}" > "${{ matrix.platform.archive_name }}.sha256"

          # Linux Package Generation: Debian / Ubuntu (.deb)
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "[*] Building Debian package (.deb)..."
            deb_dir="panadiga_deb_pkg"
            mkdir -p "$deb_dir/DEBIAN"
            mkdir -p "$deb_dir/usr/bin"
            mkdir -p "$deb_dir/usr/share/panadiga"
            cp "${{ matrix.platform.cli_bin }}" "$deb_dir/usr/bin/panadiga"
            cp "${{ matrix.platform.desktop_bin }}" "$deb_dir/usr/bin/panadiga-desktop"
            chmod 755 "$deb_dir/usr/bin/panadiga" "$deb_dir/usr/bin/panadiga-desktop"
            cp -r tools "$deb_dir/usr/share/panadiga/tools"
            printf "Package: panadiga\nVersion: 0.1.0\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: OrgChrono Engineering <support@orgchrono.com>\nDepends: libc6, libwebkit2gtk-4.1-0, libayatana-appindicator3-1\nDescription: Panasonic DIGA DMR-EH55 Forensic, NVRAM and Reverse Engineering Suite\n" > "$deb_dir/DEBIAN/control"
            dpkg-deb --build "$deb_dir" "panadiga-linux-amd64.deb"
            shasum -a 256 "panadiga-linux-amd64.deb" > "panadiga-linux-amd64.deb.sha256"
          fi

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-${{ matrix.platform.name }}
          path: |
            ${{ matrix.platform.archive_name }}
            ${{ matrix.platform.archive_name }}.sha256
            *.deb
            *.deb.sha256
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.platform.archive_name }}
            ${{ matrix.platform.archive_name }}.sha256
            *.deb
            *.deb.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
