[package]
name = "panasonic-diga-desktop"
version = "0.1.0"
description = "Panasonic DMR-EH55 DIGA Engineering Suite"
edition = "2021"

[lib]
name = "panasonic_diga_desktop_lib"
crate-type = ["lib"]
test = false
doctest = false

[[bin]]
name = "panasonic-diga-desktop"
path = "src/main.rs"
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
panadiga = { path = "../../.." }
serialport = "4.5"
anyhow = "1.0"
thiserror = "2.0"
