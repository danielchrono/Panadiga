[package]
name = "panadiga"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Systems Engineering Team"]
description = "Panasonic DMR-EH55 & DIGA Engineering, Storage Forensics, and Reverse Engineering Suite"
readme = "README.md"

[lib]
name = "panadiga"
crate-type = ["rlib"]

[[bin]]
name = "panadiga"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
byteorder = "1.5"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
lopdf = "0.47.0"
serialport = "4.5"
regex = "1.10"
tauri = { version = "2.0", default-features = false, features = ["wry"] }
tauri-plugin-shell = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Console",
] }

[build-dependencies]
tauri-build = { version = "2.0", default-features = false }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 20
incremental = true
strip = true
