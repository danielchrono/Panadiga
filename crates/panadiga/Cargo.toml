[package]
name = "panadiga"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Systems Engineering Team"]
description = "Panasonic DMR-EH55 & DIGA Engineering, Storage Forensics, and Reverse Engineering Suite"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
byteorder = "1.5"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
lopdf = "0.47.0"
serialport = "4.5"
