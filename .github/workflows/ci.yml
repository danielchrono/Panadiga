name: CI/CD Multi-Platform Build & Verification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Rust Multi-OS Compilation & Regression Testing
  # ==========================================================================
  rust-workspace:
    name: Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Run Test Suite (Unit, Regression & Forensics)
        run: cargo test --workspace --verbose

  # ==========================================================================
  # 2. Code Quality, Lints & Copy/Paste Duplication Gate (jscpd)
  # ==========================================================================
  code-quality:
    name: Code Quality, Clippy & Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings || true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Desktop Node Dependencies
        run: cd apps/desktop && npm ci

      - name: Run Copy/Paste Detector (jscpd)
        run: npx --prefix apps/desktop jscpd --config .jscpd.json

  # ==========================================================================
  # 3. Desktop Application Frontend (Types, Vitest, uxlint, Playwright, Build)
  # ==========================================================================
  desktop-frontend:
    name: Desktop UI (Types, Vitest, uxlint, Playwright, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Type-Check
        run: npm run typecheck

      - name: Run Vitest Unit & ViewModel Tests
        run: npm test

      - name: Run UI/UX State Completeness Linter (uxlint)
        run: npm run uxlint

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End Tests
        run: npm run test:e2e

      - name: Vite Production Build
        run: npm run build

  # ==========================================================================
  # 4. Ghidra Native Script Generator & Python Tools Gate (Typer, Mypy, Pytest)
  # ==========================================================================
  ghidra-and-python-tools:
    name: Ghidra Generator & Python Tools (Typer, Mypy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Export Ghidra Scripts from Rust SSOT
        run: cargo run -- ghidra export-all --dir tools

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Quality Tools
        run: pip install typer rich mypy pytest

      - name: Verify Exported Python Syntax
        run: python -m py_compile tools/ghidra_am34_memory_map.py tools/ghidra_importar_simbolos_panadiga.py tools/ghidra_conectar_debugger.py

      - name: Run Mypy Strict Type Check on Typer CLI
        run: python -m mypy tools/panadiga_cli.py

      - name: Run Pytest Suite (Typer CLI Tests)
        run: python -m pytest tools/tests

  # ==========================================================================
  # 5. Pico Firmware Cross-Compilation (RP2040 & RP2350)
  # ==========================================================================
  pico-firmware-cross-compile:
    name: Pico Firmware Dual Target (RP2040 & RP2350)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Embedded Toolchain & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Clone Raspberry Pi Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git ${{ runner.temp }}/pico-sdk
          cd ${{ runner.temp }}/pico-sdk
          git submodule update --init --depth 1

      - name: Build Firmware for RP2040 (Raspberry Pi Pico / Pico W)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export CXXFLAGS="-include cstdint"
          cd dwire32a_jtag_research
          cmake -B build_pico -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build_pico --config Release
          cp build_pico/panasonic_dwire32a.uf2 ./panasonic_dwire32a_rp2040.uf2
          sha256sum panasonic_dwire32a_rp2040.uf2

      - name: Build Firmware for RP2350 (Raspberry Pi Pico 2 ARM Cortex-M33)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export CXXFLAGS="-include cstdint"
          cd dwire32a_jtag_research
          cmake -B build_pico2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build_pico2 --config Release
          cp build_pico2/panasonic_dwire32a.uf2 ./panasonic_dwire32a_rp2350.uf2
          sha256sum panasonic_dwire32a_rp2350.uf2

      - name: Upload Compiled Firmware Artifacts (UF2)
        uses: actions/upload-artifact@v4
        with:
          name: panasonic_dwire32a_firmware_binaries
          path: |
            dwire32a_jtag_research/panasonic_dwire32a_rp2040.uf2
            dwire32a_jtag_research/panasonic_dwire32a_rp2350.uf2
          retention-days: 30
