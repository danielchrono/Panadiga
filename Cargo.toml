[workspace]
resolver = "2"
members = [
    "crates/panadiga-core",
    "crates/panadiga-rag",
    "crates/panadiga-mcp",
    "crates/panadiga-cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/panadiga-core",
    "crates/panadiga-rag",
    "crates/panadiga-mcp",
    "crates/panadiga-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Antigravity Systems Engineering Team"]
license = "MIT"
repository = "https://github.com/danie/Panadiga"

[workspace.dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
hex = "0.4"
lopdf = "0.47.0"
md-5 = "0.10"
memmap2 = "0.9"
rayon = "1.12"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.5"
sha2 = "0.10"
tauri = { version = "2.0", default-features = false, features = ["wry"] }
tauri-build = { version = "2.0", default-features = false, features = [] }
tauri-plugin-shell = "2.0"
thiserror = "2.0"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 20
incremental = true
strip = true
