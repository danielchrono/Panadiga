name: Panadiga CI & Cross-Platform Suite

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master", "**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Full 9 Quality Gates Suite & Windows Release Build
  # ==========================================================================
  quality-gates-windows:
    name: Full 9 Quality Gates & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Desktop UI Dependencies & Playwright
        working-directory: apps/desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install mypy pytest matplotlib

      - name: Execute Full 9 Commit Quality Gates & Windows Release Build
        run: .\build.cmd --ci --desktop --strict-toolchains

      - name: Upload Windows Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-windows-x86_64
          path: |
            dist/panadiga.exe
            dist/panadiga-desktop.exe
            dist/panasonic_p7501_uart_rp2040.uf2
            dist/panasonic_p7501_uart_rp2350.uf2
            dist/panasonic_p7501_uart_unified.uf2
            dist/tools/
            dist/releases/panadiga-windows-x86_64.zip
            dist/releases/SHA256SUMS.txt
          retention-days: 30

  # ==========================================================================
  # 2. Cross-Platform Compilation & Regression Suite (Ubuntu & macOS)
  # ==========================================================================
  cross-platform:
    name: Platform Build & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install UI Dependencies & Build Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run check:ci
          npm run build

      - name: Run Cargo Clippy & Native Rust Workspace Tests
        run: |
          cargo clippy --workspace --all-targets --no-deps -- -D warnings || true
          cargo test --workspace --verbose

      - name: Compile Release Binaries
        run: cargo build --release -p panadiga-cli -p panadiga-desktop

      - name: Package Distribution
        run: |
          mkdir -p dist/tools
          cp -f target/release/panadiga dist/panadiga
          cp -f target/release/panadiga-desktop dist/panadiga-desktop
          chmod +x dist/panadiga dist/panadiga-desktop
          if [ -d "tools/ghidra" ]; then cp -rf tools/ghidra dist/tools/; fi
          if [ -f "tools/README.md" ]; then cp -f tools/README.md dist/tools/README.md; fi

      - name: Upload Platform Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-${{ matrix.os }}
          path: |
            dist/panadiga
            dist/panadiga-desktop
          retention-days: 14

  # ==========================================================================
  # 3. Raspberry Pi Pico Firmware Dual Target (RP2040 & RP2350)
  # ==========================================================================
  pico-firmware:
    name: Pico Firmware Dual Target (RP2040 & RP2350)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install ARM Embedded Toolchain, Ninja & CCache
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build ccache libudev-dev pkg-config

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache Pico C/C++ Compilation Objects (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-pico-${{ runner.os }}-${{ hashFiles('firmware/pico-p7501/**') }}
          restore-keys: |
            ccache-pico-${{ runner.os }}-

      - name: Cache Raspberry Pi Pico SDK (2.1.1)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pico-sdk
          key: pico-sdk-2.1.1-${{ runner.os }}

      - name: Clone Raspberry Pi Pico SDK
        run: |
          if [ ! -d "${{ runner.temp }}/pico-sdk/.git" ]; then
            git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git ${{ runner.temp }}/pico-sdk
            cd ${{ runner.temp }}/pico-sdk
            git submodule update --init --depth 1
          fi

      - name: Verify POSIX Launcher & Build Firmware in Parallel (RP2040 & RP2350)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          sh -n ./build.sh
          ./build.sh --pico --strict-toolchains --no-cache
          mkdir -p target/pico-build/out
          cp crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_rp2040.uf2 target/pico-build/out/panasonic_p7501_uart_rp2040.uf2
          cp crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_rp2350.uf2 target/pico-build/out/panasonic_p7501_uart_rp2350.uf2
          cp crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2 target/pico-build/out/panasonic_p7501_uart_unified.uf2
          sha256sum target/pico-build/out/*.uf2

      - name: Upload Compiled Firmware Artifacts (UF2)
        uses: actions/upload-artifact@v4
        with:
          name: panasonic_p7501_uart_firmware_binaries
          path: |
            target/pico-build/out/panasonic_p7501_uart_rp2040.uf2
            target/pico-build/out/panasonic_p7501_uart_rp2350.uf2
            target/pico-build/out/panasonic_p7501_uart_unified.uf2
          retention-days: 30

  # ==========================================================================
  # 4. Android Mobile APK Build (Tauri 2 Mobile / ARM64)
  # ==========================================================================
  android-apk:
    name: Android APK Build (Tauri 2 Mobile / ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_PATH"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Prebuilt cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies & Build Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Verify Android Rust Target Compilation
        run: cargo check -p panadiga-core -p panadiga-desktop --lib --target aarch64-linux-android

      - name: Initialize & Build Android APK
        run: |
          export ANDROID_NDK_ROOT=$NDK_HOME
          cd apps/desktop
          npx @tauri-apps/cli android init --ci --skip-targets-install || true
          npx @tauri-apps/cli android build --apk --target aarch64-linux-android || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-android-apk
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 30
          