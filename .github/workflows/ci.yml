name: Panadiga CI & Cross-Platform Suite

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master", "**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Full 9 Quality Gates Suite & Windows Release Build
  # ==========================================================================
  quality-gates-windows:
    name: Full 9 Quality Gates & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Desktop UI Dependencies & Playwright
        working-directory: apps/desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install typer rich mypy pytest

      - name: Execute Full 9 Commit Quality Gates
        run: python scripts/validate.py

      - name: Compile & Package Windows Distribution Archive
        run: python scripts/build.py --desktop

      - name: Upload Windows Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-windows-x86_64
          path: |
            dist/panadiga.exe
            dist/panasonic_dwire32a_rp2040.uf2
            dist/panasonic_dwire32a_rp2350.uf2
            dist/panasonic_dwire32a_unified.uf2
            dist/tools/
            dist/releases/panadiga-windows-x86_64.zip
            dist/releases/SHA256SUMS.txt
          retention-days: 30

  # ==========================================================================
  # 2. Cross-Platform Compilation & Regression Suite (Ubuntu & macOS)
  # ==========================================================================
  cross-platform:
    name: Platform Build & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install UI Dependencies & Build Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Run Cargo Check & Clippy
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings || true

      - name: Run Native Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Compile Release Binary
        run: cargo build --release -p panadiga

      - name: Package Distribution
        run: |
          mkdir -p dist/tools
          cp -f target/release/panadiga dist/panadiga
          chmod +x dist/panadiga
          if [ -d "tools" ]; then cp -rf tools/* dist/tools/ 2>/dev/null || true; fi

      - name: Upload Platform Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-${{ matrix.os }}
          path: dist/panadiga
          retention-days: 14

  # ==========================================================================
  # 3. Raspberry Pi Pico Firmware Dual Target (RP2040 & RP2350)
  # ==========================================================================
  pico-firmware:
    name: Pico Firmware Dual Target (RP2040 & RP2350)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install ARM Embedded Toolchain & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Clone Raspberry Pi Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git ${{ runner.temp }}/pico-sdk
          cd ${{ runner.temp }}/pico-sdk
          git submodule update --init --depth 1

      - name: Build Firmware for RP2040 (Raspberry Pi Pico / Pico W)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export CXXFLAGS="-include cstdint"
          cd dwire32a_jtag_research
          cmake -B build_pico -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build_pico --config Release
          cp build_pico/panasonic_dwire32a.uf2 ./panasonic_dwire32a_rp2040.uf2
          sha256sum panasonic_dwire32a_rp2040.uf2

      - name: Build Firmware for RP2350 (Raspberry Pi Pico 2 ARM Cortex-M33)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export CXXFLAGS="-include cstdint"
          cd dwire32a_jtag_research
          cmake -B build_pico2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build_pico2 --config Release
          cp build_pico2/panasonic_dwire32a.uf2 ./panasonic_dwire32a_rp2350.uf2
          sha256sum panasonic_dwire32a_rp2350.uf2

      - name: Merge Unified Multi-Family UF2 (RP2040 + RP2350)
        run: |
          cd dwire32a_jtag_research
          python3 merge_unified_uf2.py \
            --rp2040 panasonic_dwire32a_rp2040.uf2 \
            --rp2350 panasonic_dwire32a_rp2350.uf2 \
            --out panasonic_dwire32a_unified.uf2
          sha256sum panasonic_dwire32a_unified.uf2

      - name: Upload Compiled Firmware Artifacts (UF2)
        uses: actions/upload-artifact@v4
        with:
          name: panasonic_dwire32a_firmware_binaries
          path: |
            dwire32a_jtag_research/panasonic_dwire32a_rp2040.uf2
            dwire32a_jtag_research/panasonic_dwire32a_rp2350.uf2
            dwire32a_jtag_research/panasonic_dwire32a_unified.uf2
          retention-days: 30

  # ==========================================================================
  # 4. Android Mobile APK Build (Tauri 2 Mobile / ARM64)
  # ==========================================================================
  android-apk:
    name: Android APK Build (Tauri 2 Mobile / ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_PATH"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies & Build Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Initialize & Build Android APK
        run: |
          export ANDROID_NDK_ROOT=$NDK_HOME
          sed -i 's/crate-type = \["rlib"\]/crate-type = \["staticlib", "cdylib", "rlib"\]/g' Cargo.toml
          npx @tauri-apps/cli android init --ci --skip-targets-install || true
          npx @tauri-apps/cli android build --apk --target aarch64-linux-android || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panadiga-android-apk
          path: |
            gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 30
          